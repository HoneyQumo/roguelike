name: Build Game Solution

on: 
  push:
    branches:
      - main # Запускать при пуше в ветку main
  pull_request:
    branches:
      - main # Запускать при создании Pull Request в ветку main
jobs:
  build:
    runs-on: windows-latest # Иcnользуем Windows Runner
    
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up MSBuild and Visual Studio
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      # Step 3: Restore NuGet packages (packages.config в EngineTest)
      - name: Restore NuGet packages
        run: |
          msbuild Roguelike.sln -t:restore -p:RestorePackagesConfig=true
      
      # Step 4: Build the solution
      - name: Build solution
        run: | 
          msbuild Roguelike.sln /p:Configuration=Release /p:Platform=x64
