name: Build Game Solution

on:
  push:
    branches:
      - main # Ветку проверяет pull_request, здесь проверяется main после мержа
  pull_request:
    branches:
      - main

# Новый пуш обесценивает предыдущий прогон по той же ветке, но не по main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30 # Что зависло, то красное: дефолтные шесть часов ждать нечего

    strategy:
      fail-fast: false # Падение Debug не должно скрывать результат Release
      matrix:
        configuration: [Debug, Release]

    name: ${{ matrix.configuration }}|x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: |
          msbuild Roguelike.sln -t:restore -p:RestorePackagesConfig=true

      - name: Build solution
        run: |
          msbuild Roguelike.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      - name: Run tests
        run: |
          .\x64\${{ matrix.configuration }}\EngineTest.exe --gtest_output=xml:test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: test-results.xml
          if-no-files-found: error

      - name: Upload game build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: roguelike-${{ matrix.configuration }}
          path: |
            Roguelike/x64/Release/Roguelike.exe
            Roguelike/x64/Release/openal32.dll
            Roguelike/x64/Release/Resources/
          if-no-files-found: error
