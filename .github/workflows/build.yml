name: Build Game Solution

on:
  push:
    branches:
      - '**' # Запускать на любой ветке
  pull_request:
    branches:
      - main # И на каждый Pull Request в main

jobs:
  build:
    runs-on: windows-latest # Иcnользуем Windows Runner

    strategy:
      fail-fast: false # Падение Debug не должно скрывать результат Release
      matrix:
        configuration: [Debug, Release]

    name: ${{ matrix.configuration }}|x64

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up MSBuild and Visual Studio
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Step 3: Restore NuGet packages (packages.config в EngineTest)
      - name: Restore NuGet packages
        run: |
          msbuild Roguelike.sln -t:restore -p:RestorePackagesConfig=true

      # Step 4: Build the solution
      - name: Build solution
        run: |
          msbuild Roguelike.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      # Step 5: Run unit tests
      - name: Run tests
        run: |
          .\x64\${{ matrix.configuration }}\EngineTest.exe --gtest_output=xml:test-results.xml

      # Step 6: Keep the report even when tests fail
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: test-results.xml
          if-no-files-found: error
